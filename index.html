<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mission XR — Secure Access</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/ops-style.css">
</head>
<body>



<!-- ===== LOGIN SCREEN ===== -->
<div id="login-screen">
  <div class="bg-pulse"></div>
  <div class="login-box">
    <div class="logo">OPS<span>::</span>CONSOLE</div>
    <div class="subtitle">MISSION CONTROL PLATFORM — SECURE ACCESS</div>
    <div class="alert danger" id="alert-box"></div>
    <div class="field">
      <label>USERNAME</label>
      <input type="text" id="input-user" placeholder="user@ops.net">
      <div class="field-error" id="err-user">Username is required</div>
    </div>
    <div class="field">
      <label>PASSWORD</label>
      <input type="password" id="input-pass" placeholder="••••••••">
      <div class="field-error" id="err-pass">Password is required</div>
    </div>
    <button class="btn-login" id="btn-login">SIGN IN</button>
    <div class="demo-section">
      <div class="demo-label">— DEMO USERS (click to autofill) —</div>
      <div class="demo-users">
        <div class="demo-user" id="demo-sup">
          <div class="demo-user-info"><span class="demo-user-name">supervisor@ops.net</span><span class="demo-user-creds">pass: super123</span></div>
          <span class="demo-role role-supervisor">SUPERVISOR</span>
        </div>
        <div class="demo-user" id="demo-op">
          <div class="demo-user-info"><span class="demo-user-name">operator@ops.net</span><span class="demo-user-creds">pass: oper123</span></div>
          <span class="demo-role role-operator">OPERATOR</span>
        </div>
        <div class="demo-user" id="demo-view">
          <div class="demo-user-info"><span class="demo-user-name">viewer@ops.net</span><span class="demo-user-creds">pass: view123</span></div>
          <span class="demo-role role-viewer">VIEWER</span>
        </div>
      </div>
    </div>
    <div class="status-bar">
      <div class="status-dot-row"><div class="sdot"></div><span>SERVER ONLINE</span></div>
      <span class="version">v0.1.0 — PROTOTYPE</span>
    </div>
  </div>
</div>



<!-- Scripts — load order matters -->
<script src="js/data.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
